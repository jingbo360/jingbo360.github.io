<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Antigravity</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #000; color: #f5f5f7; }
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; }
  p { margin: 0 0 24px; font-size: 15px; opacity: .6; }
  .btn {
    display: block;
    padding: 14px 20px;
    border-radius: 12px;
    background: #0071e3;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
  }
  .btn + .btn { margin-top: 12px; }
  .btn[hidden] { display: none; }
  noscript .btn { margin-top: 24px; }
  noscript .btn + .btn { margin-top: 12px; }
</style>
</head>
<body>
<main>
  <h1 id="title">页面不存在</h1>
  <p id="desc">请检查链接是否正确。</p>
  <a id="action" class="btn" hidden></a>
  <a id="action2" class="btn" hidden></a>
  <a id="action3" class="btn" hidden></a>
  <noscript>
    <a class="btn" href="https://apps.apple.com/app/id6747373608">前往 App Store 下载 Antigravity</a>
    <a class="btn" href="https://sj.qq.com/appdetail/com.antigravity.ag">前往应用宝下载 Antigravity</a>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.antigravity.ag">前往 Google Play 下载 Antigravity</a>
  </noscript>
</main>
<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------
   * 配置区
   * ---------------------------------------------------------------- */

  // Antigravity 的 App Store 数字 ID，与 App 内
  // SettingItemsViewController.AppStoreID 保持一致。
  var APP_STORE_URL = 'https://apps.apple.com/app/id6747373608';

  // 应用宝（国内主渠道）。Android 设备默认跳这里。
  // 包名与 Android 端 applicationId 一致：com.antigravity.ag。
  var ANDROID_STORE_URL = 'https://sj.qq.com/appdetail/com.antigravity.ag';

  // Google Play（海外渠道）。当前只作为页面上的手动入口，不自动跳。
  // 若要让 Android 默认走 Play，把上面的 ANDROID_STORE_URL 换成这个值即可。
  var PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=com.antigravity.ag';

  // 固定路径前缀（不可变），只取它后面的最后一段作为 key。
  // 与 AASA 的 components "/app/*" 对齐：/app/nfc/<key>
  var PATH_PREFIX = '/app/nfc/';

  // key -> 行为。当前只支持 'store'（按平台去各自商店）。
  // 新增入口时在这里加一行，不需要新建目录、不需要改 AASA。
  var KEY_ACTIONS = {
    connect: 'store'         // NFC 贴标签连设备
  };

  /* ------------------------------------------------------------------
   * 实现
   * ---------------------------------------------------------------- */

  // 'ios' | 'android' | 'other'
  function platform() {
    var ua = navigator.userAgent || '';
    if (/iPad|iPhone|iPod/.test(ua)) return 'ios';
    // iPadOS 13+ 的 Safari 伪装成 Macintosh，靠触点数区分
    if (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) return 'ios';
    // 鸿蒙 4 及以下 UA 里仍带 Android；HarmonyOS NEXT 不带，会落到 'other'
    if (/Android/i.test(ua)) return 'android';
    return 'other';
  }

  function resolveKey(pathname) {
    if (pathname.indexOf(PATH_PREFIX) !== 0) return null;
    var rest = pathname.slice(PATH_PREFIX.length).replace(/\/+$/, '');
    if (!rest) return null;
    var segments = rest.split('/');
    var key = segments[segments.length - 1].toLowerCase();
    return key || null;
  }

  // links: [{ text, href }, ...]，最多三个按钮
  function render(title, desc, links) {
    document.getElementById('title').textContent = title;
    document.getElementById('desc').textContent = desc;
    var slots = ['action', 'action2', 'action3'];
    for (var i = 0; i < slots.length; i++) {
      var el = document.getElementById(slots[i]);
      var link = links && links[i];
      if (link) {
        el.textContent = link.text;
        el.href = link.href;
        el.hidden = false;
      } else {
        el.hidden = true;
      }
    }
  }

  var STORE_LINKS = [
    { text: '前往 App Store 下载 Antigravity', href: APP_STORE_URL },
    { text: '前往应用宝下载 Antigravity', href: ANDROID_STORE_URL },
    { text: '前往 Google Play 下载 Antigravity', href: PLAY_STORE_URL }
  ];

  var key = resolveKey(location.pathname);
  var action = key ? KEY_ACTIONS[key] : null;

  if (action === 'store') {
    // 能跑到这里说明 App 未安装 —— 已安装时 iOS / Android 会把 URL 直接交给 App，
    // 浏览器不会发起这次请求，所以这里不需要探测 App 是否存在。
    var os = platform();
    if (os === 'ios') {
      location.replace(APP_STORE_URL);
      return;
    }
    if (os === 'android') {
      location.replace(ANDROID_STORE_URL);
      return;
    }
    // 桌面或其他平台：给各商店入口，不自动跳
    render('Antigravity', '请在手机上安装 App 后打开此链接。', STORE_LINKS);
    return;
  }

  // 未配置的 key / 非约定前缀的路径：保持一个正常 404 页面，不劫持整站
  if (key) {
    render('页面不存在', '链接已失效或版本不匹配。', STORE_LINKS);
  }
})();
</script>
</body>
</html>
