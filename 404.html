<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Antigravity</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #000; color: #f5f5f7; }
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; }
  p { margin: 0 0 24px; font-size: 15px; opacity: .6; }
  .btn {
    display: block;
    padding: 14px 20px;
    border-radius: 12px;
    background: #0071e3;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
  }
  .btn[hidden] { display: none; }
  noscript .btn { margin-top: 24px; }
</style>
</head>
<body>
<main>
  <h1 id="title">页面不存在</h1>
  <p id="desc">请检查链接是否正确。</p>
  <a id="action" class="btn" hidden></a>
  <noscript>
    <a class="btn" href="https://apps.apple.com/app/id6747373608">前往 App Store 下载 Antigravity</a>
  </noscript>
</main>
<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------
   * 配置区
   * ---------------------------------------------------------------- */

  // Antigravity 的 App Store 数字 ID，与 App 内
  // SettingItemsViewController.AppStoreID 保持一致。
  var APP_STORE_URL = 'https://apps.apple.com/app/id6747373608';

  // 固定路径前缀（不可变），只取它后面的最后一段作为 key。
  // 与 AASA 的 components "/app/*" 对齐：/app/nfc/<key>
  var PATH_PREFIX = '/app/nfc/';

  // key -> 行为。当前只支持 'appstore'。
  // 新增入口时在这里加一行，不需要新建目录、不需要改 AASA。
  var KEY_ACTIONS = {
    connect: 'appstore'      // NFC 贴标签连设备
  };

  /* ------------------------------------------------------------------
   * 实现
   * ---------------------------------------------------------------- */

  function isIOS() {
    var ua = navigator.userAgent || '';
    if (/iPad|iPhone|iPod/.test(ua)) return true;
    // iPadOS 13+ 的 Safari 伪装成 Macintosh，靠触点数区分
    return /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
  }

  function resolveKey(pathname) {
    if (pathname.indexOf(PATH_PREFIX) !== 0) return null;
    var rest = pathname.slice(PATH_PREFIX.length).replace(/\/+$/, '');
    if (!rest) return null;
    var segments = rest.split('/');
    var key = segments[segments.length - 1].toLowerCase();
    return key || null;
  }

  function render(title, desc, linkText, linkHref) {
    document.getElementById('title').textContent = title;
    document.getElementById('desc').textContent = desc;
    if (linkText && linkHref) {
      var action = document.getElementById('action');
      action.textContent = linkText;
      action.href = linkHref;
      action.hidden = false;
    }
  }

  var key = resolveKey(location.pathname);
  var action = key ? KEY_ACTIONS[key] : null;

  if (action === 'appstore') {
    // 能跑到这里说明 App 未安装 —— 已安装时 iOS 会把 URL 直接交给 App，
    // Safari 不会发起这次请求，所以这里不需要探测 App 是否存在。
    if (isIOS()) {
      location.replace(APP_STORE_URL);
      return;
    }
    render('Antigravity', '请在 iPhone 或 iPad 上打开此链接。', '前往 App Store', APP_STORE_URL);
    return;
  }

  // 未配置的 key / 非约定前缀的路径：保持一个正常 404 页面，不劫持整站
  if (key) {
    render('页面不存在', '链接已失效或版本不匹配。', '前往 App Store 下载 Antigravity', APP_STORE_URL);
  }
})();
</script>
</body>
</html>
